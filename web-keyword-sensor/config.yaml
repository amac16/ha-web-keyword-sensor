name: Web Keyword Sensor
version: "1.7.2"
slug: web_keyword_sensor
description: Create sensors from phrases found on web pages
url: https://github.com/amac16/ha-web-keyword-sensor#readme
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:text-search
panel_title: Web Keyword Sensor
homeassistant_api: true
arch:
  - amd64
  - aarch64
options:
  mqtt_host: homeassistant.local
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  request_timeout: 30
  max_concurrent_checks: 2
  max_response_bytes: 2097152
  checks: "[]"
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  discovery_prefix: str
  request_timeout: int(5,120)
  max_concurrent_checks: int(1,8)
  max_response_bytes: int(65536,16777216)
  checks: str
environment:
  PYTHONUNBUFFERED: "1"
