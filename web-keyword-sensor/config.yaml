name: Web Keyword Sensor
version: "1.0.0"
slug: web_keyword_sensor
description: Create sensors from phrases found on web pages
url: https://github.com/example/web-keyword-sensor
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
options:
  mqtt_host: homeassistant.local
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  request_timeout: 30
  checks: "[]"
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  discovery_prefix: str
  request_timeout: int(5,120)
  checks: str
environment:
  PYTHONUNBUFFERED: "1"
